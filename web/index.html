<title>CropLeftover AI</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700&family=Noto+Sans:wght@400;600&family=Noto+Sans+Tamil:wght@400;600&family=Noto+Sans+Telugu:wght@400;600&family=Noto+Sans+Devanagari:wght@400;600&display=swap">
<style>
/* Layout: one narrow column like a phone app. Language and role switches on top, a three-tab bar fixed at the bottom. */
:root{
  --bg:#F1F4F2; --surface:#FFFFFF; --surface2:#E4EBE6; --fg:#13221C; --muted:#4D6157; --line:#C9D5CD;
  --accent:#2E7D4F; --accent-fg:#FFFFFF; --straw:#8A5F00; --straw-bg:#F6E9C4;
  --warn-bg:#FBEBD0; --warn-fg:#6F4300; --ok-bg:#DDF0E3; --ok-fg:#1B5E37; --bad-bg:#F8DEDA; --bad-fg:#8A2C20;
  --display:'Bitter','Noto Sans','Noto Sans Tamil','Noto Sans Telugu','Noto Sans Devanagari',Georgia,serif;
  --body:'Noto Sans','Noto Sans Tamil','Noto Sans Telugu','Noto Sans Devanagari',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1713; --surface:#16231D; --surface2:#1F3027; --fg:#E4EEE8; --muted:#9DB3A8; --line:#2C4036;
  --accent:#5CC389; --accent-fg:#08150E; --straw:#E3B65A; --straw-bg:#3A2F12;
  --warn-bg:#3A2C12; --warn-fg:#F0C878; --ok-bg:#173626; --ok-fg:#8FDBAE; --bad-bg:#3A1B17; --bad-fg:#F2A89E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1713; --surface:#16231D; --surface2:#1F3027; --fg:#E4EEE8; --muted:#9DB3A8; --line:#2C4036;
  --accent:#5CC389; --accent-fg:#08150E; --straw:#E3B65A; --straw-bg:#3A2F12;
  --warn-bg:#3A2C12; --warn-fg:#F0C878; --ok-bg:#173626; --ok-fg:#8FDBAE; --bad-bg:#3A1B17; --bad-fg:#F2A89E; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:16px 104px}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:16px;min-width:0}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.2}
h1{font-size:1.65rem}
h2{font-size:1.25rem}
p{margin:0}
.tag{color:var(--muted);font-size:.95rem}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 0;min-width:76px;min-height:42px;border:1px solid var(--line);background:var(--surface);color:var(--fg);
  border-radius:8px;font:inherit;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.chip{align-self:flex-start;min-height:40px;padding:6px 14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:99px;font:inherit;font-size:.92rem;cursor:pointer}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card h3{font-size:1.05rem}
.sub{color:var(--muted);font-size:.9rem}
.stack{display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lbl{font-weight:600;font-size:.95rem}
input[type=text],input[type=number],input[type=tel],select{width:100%;min-height:46px;padding:8px 12px;border:1px solid var(--line);
  border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.95rem}
.check input{width:22px;height:22px;margin-top:2px;flex:none;accent-color:var(--accent)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.opts .check{border:1px solid var(--line);border-radius:8px;padding:10px;align-items:center;background:var(--bg)}
.btn{min-height:46px;padding:10px 16px;border-radius:8px;border:1px solid var(--accent);background:transparent;color:var(--accent);
  font:inherit;font-weight:600;cursor:pointer;width:100%}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.btn.quiet{border-color:var(--line);color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.msg{padding:10px 12px;border-radius:8px;font-size:.95rem}
.msg.ok{background:var(--ok-bg);color:var(--ok-fg)}
.msg.warn{background:var(--warn-bg);color:var(--warn-fg)}
.msg.bad{background:var(--bad-bg);color:var(--bad-fg)}
.msg.info{background:var(--surface2);color:var(--fg)}
.caution{color:var(--warn-fg);background:var(--warn-bg);border-radius:6px;padding:6px 10px;font-size:.88rem}
.badge{display:inline-block;font-size:.72rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:99px;background:var(--straw-bg);color:var(--straw);vertical-align:middle}
.badge.real{background:var(--ok-bg);color:var(--ok-fg)}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.scoreline{display:flex;justify-content:space-between;font-size:.85rem;font-variant-numeric:tabular-nums;color:var(--muted)}
.facts{font-variant-numeric:tabular-nums}
.status{font-weight:600}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;gap:4px;
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:5}
nav.tabs button{flex:1 1 0;min-width:0;border:0;background:transparent;color:var(--muted);font:inherit;font-size:.72rem;line-height:1.2;
  padding:6px 2px;border-radius:8px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:600;background:var(--surface2)}
.foot{font-size:.82rem;color:var(--muted)}
.foot button{background:none;border:0;color:var(--muted);text-decoration:underline;font:inherit;cursor:pointer;padding:4px 0}
@media (max-width:380px){.row2{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s}}
</style>

<div class="wrap">
  <header class="stack">
    <h1 id="title"></h1>
    <p class="tag" id="tagline"></p>
    <div class="seg" id="langs" role="group" aria-label="Language"></div>
    <div class="seg" id="roles" role="group" aria-label="Role"></div>
    <button class="chip" id="who" type="button" hidden></button>
    <p class="sub" id="mode"></p>
  </header>
  <main id="app" class="stack"></main>
  <footer class="foot stack">
    <p id="disclaimer"></p>
    <div id="reset"></div>
  </footer>
</div>

:"कीमत तय नहीं, बातचीत संभव"},"ai_btn":{"en":"Explain in simple words (AI)","ta":"எளிய சொற்களில் விளக்கு (AI)","te":"సులభమైన మాటల్లో వివరించు (AI)","hi":"सरल शब्दों में समझाएँ (AI)"},"ai_disclaimer":{"en":"AI-written explanation of the suggestions above. Not verified agricultural advice.","ta":"மேலே உள்ள பரிந்துரைகளுக்கான AI விளக்கம். சரிபார்க்கப்பட்ட வேளாண் ஆலோசனை அல்ல.","te":"పై సూచనలకు AI రాసిన వివరణ. ధృవీకరించిన వ్యవసాయ సలహా కాదు.","hi":"ऊपर के सुझावों की AI द्वारा लिखी व्याख्या। सत्यापित कृषि सलाह नहीं।"},"ai_unavailable":{"en":"AI explanation is not set up. The rule-based results above still work.","ta":"AI விளக்கம் அமைக்கப்படவில்லை. மேலே உள்ள விதி அடிப்படையிலான முடிவுகள் தொடர்ந்து செயல்படும்.","te":"AI వివరణ సెటప్ చేయలేదు. పై నియమ-ఆధారిత ఫలితాలు ఇంకా పనిచేస్తాయి.","hi":"AI व्याख्या सेट नहीं है। ऊपर के नियम-आधारित परिणाम फिर भी काम करते हैं।"},"ai_error":{"en":"AI explanation failed. Please try again later.","ta":"AI விளக்கம் தோல்வியடைந்தது. பிறகு முயற்சிக்கவும்.","te":"AI వివరణ విఫలమైంది. తర్వాత మళ్ళీ ప్రయత్నించండి.","hi":"AI व्याख्या विफल रही। कृपया बाद में पुनः प्रयास करें।"},"requests_header":{"en":"My connection requests","ta":"என் இணைப்புக் கோரிக்கைகள்","te":"నా కనెక్షన్ అభ్యర్థనలు","hi":"मेरे कनेक्शन अनुरोध"},"lookup_phone":{"en":"Find my listings by phone number","ta":"தொலைபேசி எண் மூலம் என் பட்டியல்களைக் காண்க","te":"ఫోన్ నంబర్‌తో నా జాబితాలను వెతకండి","hi":"फ़ोन नंबर से मेरी सूचियाँ खोजें"},"no_requests":{"en":"No requests yet.","ta":"இன்னும் கோரிக்கைகள் இல்லை.","te":"ఇంకా అభ్యర్థనలు లేవు.","hi":"अभी कोई अनुरोध नहीं।"},"status_pending":{"en":"Pending","ta":"நிலுவையில்","te":"పెండింగ్","hi":"लंबित"},"status_accepted":{"en":"Accepted","ta":"ஏற்கப்பட்டது","te":"అంగీకరించారు","hi":"स्वीकृत"},"status_declined":{"en":"Declined","ta":"நிராகரிக்கப்பட்டது","te":"తిరస్కరించారు","hi":"अस्वीकृत"},"buyer_contact":{"en":"Buyer contact (demo)","ta":"வாங்குவோர் தொடர்பு (டெமோ)","te":"కొనుగోలుదారు సంప్రదింపు (డెమో)","hi":"खरीदार संपर्क (डेमो)"},"buyer_view_header":{"en":"Buyer view (demo only)","ta":"வாங்குவோர் பார்வை (டெமோ மட்டும்)","te":"కొనుగోలుదారు వీక్షణ (డెమో మాత్రమే)","hi":"खरीदार दृश्य (केवल डेमो)"},"buyer_view_note":{"en":"Lets you try the buyer side of the workflow. A real app would need buyer logins.","ta":"வாங்குவோர் பக்க செயல்முறையைச் சோதிக்க உதவுகிறது. உண்மையான செயலிக்கு வாங்குவோர் உள்நுழைவு தேவை.","te":"కొనుగోలుదారు వైపు ప్రక్రియను ప్రయత్నించడానికి. నిజమైన యాప్‌కు కొనుగోలుదారు లాగిన్‌లు అవసరం.","hi":"खरीदार पक्ष की प्रक्रिया आज़माने के लिए। असली ऐप में खरीदार लॉगिन चाहिए।"},"select_buyer":{"en":"Choose a demo buyer","ta":"டெமோ வாங்குவோரைத் தேர்வு செய்க","te":"డెమో కొనుగోలుదారుని ఎంచుకోండి","hi":"डेमो खरीदार चुनें"},"incoming":{"en":"Incoming requests","ta":"வந்துள்ள கோரிக்கைகள்","te":"వచ్చిన అభ్యర్థనలు","hi":"आए हुए अनुरोध"},"accept":{"en":"Accept","ta":"ஏற்கவும்","te":"అంగీకరించండి","hi":"स्वीकार करें"},"decline":{"en":"Decline","ta":"நிராகரிக்கவும்","te":"తిరస్కరించండి","hi":"अस्वीकार करें"},"farmer_contact":{"en":"Farmer contact","ta":"விவசாயி தொடர்பு","te":"రైతు సంప్రదింపు","hi":"किसान संपर्क"},"contact_hidden":{"en":"Farmer has not agreed to share contact details.","ta":"விவசாயி தொடர்பு விவரங்களைப் பகிர சம்மதிக்கவில்லை.","te":"రైతు సంప్రదింపు వివరాలు పంచుకోవడానికి అంగీకరించలేదు.","hi":"किसान ने संपर्क विवरण साझा करने की सहमति नहीं दी है।"},"disclaimer":{"en":"Suggestions come from a starter dataset and rules. They are not expert advice. Check with an agricultural or technical expert before acting. Prices and buyers are not guaranteed.","ta":"பரிந்துரைகள் தொடக்கநிலைத் தரவு மற்றும் விதிகளிலிருந்து வருகின்றன. இவை நிபுணர் ஆலோசனை அல்ல. செயல்படுவதற்கு முன் வேளாண் அல்லது தொழில்நுட்ப நிபுணரிடம் கேளுங்கள். விலை மற்றும் வாங்குவோர் உத்தரவாதம் இல்லை.","te":"సూచనలు ప్రారంభ డేటా, నియమాల నుండి వస్తాయి. ఇవి నిపుణుల సలహా కాదు. చర్య తీసుకునే ముందు వ్యవసాయ లేదా సాంకేతిక నిపుణుడిని సంప్రదించండి. ధరలు, కొనుగోలుదారులకు హామీ లేదు.","hi":"सुझाव शुरुआती डेटा और नियमों से आते हैं। ये विशेषज्ञ सलाह नहीं हैं। कदम उठाने से पहले कृषि या त "ta":"உங்களுக்குப் பொருந்தும் விவசாயிகளின் பட்டியல்கள்","te":"మీకు సరిపోయే రైతుల జాబితాలు","hi":"आपसे मेल खाती किसानों की सूचियाँ"},"b_no_listings":{"en":"No matching listings yet.","ta":"பொருந்தும் பட்டியல்கள் இன்னும் இல்லை.","te":"సరిపోయే జాబితాలు ఇంకా లేవు.","hi":"अभी कोई मेल खाती सूची नहीं।"},"demo_try":{"en":"Try as a demo buyer","ta":"டெமோ வாங்குவோராக முயற்சிக்கவும்","te":"డెమో కొనుగోలుదారుగా ప్రయత్నించండి","hi":"डेमो खरीदार के रूप में आज़माएँ"},"demo_try_note":{"en":"Demo buyers are fictional. Use this to test accepting a request.","ta":"டெமோ வாங்குவோர் கற்பனையானவர்கள். கோரிக்கையை ஏற்பதைச் சோதிக்க இதைப் பயன்படுத்தவும்.","te":"డెమో కొనుగోలుదారులు కల్పితం. అభ్యర్థనను అంగీకరించడాన్ని పరీక్షించడానికి దీన్ని వాడండి.","hi":"डेमो खरीदार काल्पनिक हैं। अनुरोध स्वीकार करने की जाँच के लिए इसका उपयोग करें।"},"shared_on":{"en":"Live: farmers and buyers on this page see each other's data.","ta":"நேரலை: இந்தப் பக்கத்தில் உள்ள விவசாயிகளும் வாங்குவோரும் ஒருவர் தரவை மற்றவர் காணலாம்.","te":"లైవ్: ఈ పేజీలోని రైతులు, కొనుగోలుదారులు ఒకరి డేటాను ఒకరు చూడగలరు.","hi":"लाइव: इस पेज पर किसान और खरीदार एक-दूसरे का डेटा देख सकते हैं।"},"shared_off":{"en":"Offline mode: data stays on this device only.","ta":"ஆஃப்லைன் முறை: தரவு இந்த சாதனத்தில் மட்டுமே இருக்கும்.","te":"ఆఫ్‌లైన్ మోడ్: డేటా ఈ పరికరంలో మాత్రమే ఉంటుంది.","hi":"ऑफ़लाइन मोड: डेटा केवल इसी डिवाइस पर रहेगा।"},"err_write":{"en":"Could not save. You may have view-only access to this page.","ta":"சேமிக்க முடியவில்லை. இந்தப் பக்கத்தில் உங்களுக்குப் பார்வை அணுகல் மட்டுமே இருக்கலாம்.","te":"సేవ్ చేయడం సాధ్యం కాలేదు. ఈ పేజీకి మీకు వీక్షణ అనుమతి మాత్రమే ఉండవచ్చు.","hi":"सहेजा नहीं जा सका। हो सकता है इस पेज पर आपके पास केवल देखने की अनुमति हो।"},"registered_badge":{"en":"REGISTERED","ta":"பதிவு பெற்றவர்","te":"నమోదైనవారు","hi":"पंजीकृत"},"farmer_label":{"en":"Farmer","ta":"விவசாயி","te":"రైతు","hi":"किसान"}},"RES":{"rice_straw":{"en":"Rice straw","ta":"நெல் வைக்கோல்","te":"వరి గడ్డి","hi":"धान की पराली / पुआल"},"coconut_husk":{"en":"Cocon ":"बायोचार"},"paper_board":{"en":"Paper pulp / board","ta":"காகிதக் கூழ் / அட்டை","te":"కాగితపు గుజ్జు / బోర్డు","hi":"कागज़ की लुगदी / बोर्ड"},"craft_fibre":{"en":"Fibre crafts","ta":"நார் கைவினைப் பொருட்கள்","te":"పీచు హస్తకళలు","hi":"रेशे से हस्तशिल्प"},"biogas":{"en":"Biogas feedstock","ta":"உயிர்வாயு மூலப்பொருள்","te":"బయోగ్యాస్ ముడిసరుకు","hi":"बायोगैस कच्चा माल"},"bedding":{"en":"Livestock bedding","ta":"கால்நடைப் படுக்கை","te":"పశువుల పరుపు","hi":"पशु बिछावन"}},"CAUT":{"feed_check":{"en":"Feed only clean, mold-free material. Ask a veterinarian or animal nutritionist about treatment and quantity.","ta":"சுத்தமான, பூஞ்சை இல்லாத பொருளை மட்டும் தீவனமாகக் கொடுங்கள். சிகிச்சை முறை மற்றும் அளவு குறித்து கால்நடை மருத்துவரிடம் கேளுங்கள்.","te":"శుభ్రమైన, బూజు లేని పదార్థాన్ని మాత్రమే మేతగా ఇవ్వండి. చికిత్స, మోతాదుపై పశువైద్యుడిని అడగండి.","hi":"केवल साफ़ और फफूंद-मुक्त सामग्री ही खिलाएँ। उपचार और मात्रा के लिए पशु चिकित्सक से पूछें।"},"dry_needed":{"en":"Dry it fully and store under cover before processing.","ta":"செயலாக்கத்திற்கு முன் நன்றாக உலர்த்தி, மூடிய இடத்தில் சேமிக்கவும்.","te":"ప్రాసెసింగ్‌కు ముందు పూర్తిగా ఎండబెట్టి, కప్పిన చోట నిల్వ చేయండి.","hi":"प्रसंस्करण से पहले पूरी तरह सुखाकर ढके स्थान पर रखें।"},"aflatoxin":{"en":"Groundnut shells can carry aflatoxin mold. Do not feed if damp, musty or discolored.","ta":"நிலக்கடலை ஓட்டில் அஃப்ளாடாக்சின் பூஞ்சை இருக்கலாம். ஈரமாக, துர்நாற்றமாக அல்லது நிறம் மாறியிருந்தால் தீவனமாகக் கொடுக்காதீர்கள்.","te":"వేరుశనగ పొట్టులో అఫ్లాటాక్సిన్ బూజు ఉండవచ్చు. తడిగా, వాసన వస్తున్నా లేదా రంగు మారినా మేతగా ఇవ్వవద్దు.","hi":"मूंगफली के छिलकों में एफ़्लाटॉक्सिन फफूंद हो सकती है। नम, बदबूदार या रंग बदले हों तो न खिलाएँ।"},"expert_check":{"en":"Check with a local agricultural officer or technical expert before large-scale use.","ta":"பெரிய அளவில் பயன்படுத்தும் முன் வேளாண் அலுவலர் அல்லது நிபுணரிடம் கேளுங்கள்.","te":"పెద్ద ఎత్తున వినియోగించే ముందు స్థానిక వ్యవసాయ అధికారిని లేదా నిపుణుడిని సంప్రదించండి.","hi":"बड़े स्तर पर उपयोग से पहले const myBuyer = () => SH.buyers[me()] || null;
const reqs = () => Object.entries(SH.requests).map(([id, r]) => Object.assign({id}, r)).concat(S.sample ? S.sample.requests : []);
const lst = id => SH.listings[id] ? Object.assign({id}, SH.listings[id]) : (S.sample && S.sample.listing.id === id ? S.sample.listing : null);
const ownListings = () => Object.entries(SH.listings).filter(([, l]) => l.farmerId === me()).map(([id, l]) => Object.assign({id}, l)).sort((a, b) => a.createdAt - b.createdAt);
const myListings = () => ownListings().concat(S.sample ? [S.sample.listing] : []);
const hasReq = (lid, bid) => reqs().some(r => r.listingId === lid && r.buyerId === bid);

function suggest(rk, cond) {
  return D.rules.filter(r => r.residue_key === rk && r.conditions.split('|').includes(cond))
    .sort((a, b) => a.priority - b.priority)
    .map(r => ({reuse: r.reuse_key, cautions: r.cautions ? r.cautions.split('|') : []}));
}
function scoreQty(qty, lo, hi, out) {
  if (qty < lo) { out.push('qty_under'); return 5; }
  if (hi != null && qty > hi) { out.push('qty_over'); return 25; }
  out.push('qty_ok'); return 35;
}
function scorePrice(price, cap, out) {
  if (!price) { out.push('price_unknown'); return 15; }
  if (cap == null || price <= cap) { out.push('price_ok'); return 25; }
  out.push('price_high'); return 0;
}
function match(l) {   // farmer listing -> buyers
  const out = [];
  for (const b of allBuyers()) {
    if (!b.residues.includes(l.residue) || !b.accepted_conditions.split('|').includes(l.cond)) continue;
    const reasons = []; let score = 0;
    const same = b.district.trim().toLowerCase() === l.district.trim().toLowerCase();
    score += same ? 40 : 10; reasons.push(same ? 'same_district' : 'other_district');
    score += scoreQty(l.qty, b.min_qty_kg || 0, b.max_qty_kg, reasons);
    score += scorePrice(l.price, b.max_price_per_kg, reasons);
    out.push({b, score, reasons});
  }
  return out.sort((a, b) => b.score - a.score || (b.b.real ? 1 : 0) - (a.b.real ? 1 : 0));
}
function matchListings(bp) {   // buyer profile -> farmer listings
  const out = [];
  for (const [id, l0] of Object.entries(SH.listings)) {
    const l = Object.assign({id}, l0);
    if (!bp.residues.includes(l.residue) || !(bp.conds || []).includes(l.cond)) continue;
    const reasons = []; let score = 0;
    const same = bp.district.trim().toLowerCase() === l.district.trim().toLowerCase();
    score += same ? 40 : 10; reasons.push(same ? 'same_district' : 'other_district');
    score += scoreQty(l.qty, bp.minQty || 0, bp.maxQty, reasons);
    score += scorePrice(l.price, bp.maxPrice, reasons);
    out.push({l, score, reasons});
  }
  return out.sort((a, b) => b.score - a.score);
}

/* ---------- writes: shared db when available, otherwise this device ---------- */
async function put(c, id, doc) {
  SH[c][id] = doc; save(); render();
  if (!dbh) return true;
  try { await dbh.doc(c + '/' + id).set(doc); return true; }
  catch (e) { flash = 'err_write'; render(); return false; }
}
async function patch(c, id, fields) {
  SH[c][id] = Object.assign({}, SH[c][id], fields); save(); render();
  if (!dbh) return true;
  try { await dbh.doc(c + '/' + id).update(fields); return true; }
  catch (e) { flash = 'err_write'; render(); return false; }
}
async function savePrivateProfile() {
  if (!dbh || !uid) return;
  try { await dbh.doc('data/users/' + uid + '/profile').set({profile: S.profile}); } catch (e) {}
}
async function loadPrivateProfile() {
  if (!dbh || !uid || S.profile) return;
  try {
    const snap = await dbh.doc('data/users/' + uid + '/profile').get();
    if (snap.exists && snap.data().profile) { S.profile = snap.data().profile; regDraft = Object.assign({}, S.profile); save(); render(); }
  } catch (e) {}
}
function setStatus(id, status) {
  if (String(id).startsWith('sr')) {
    const r = S.sample && S.sample.requests.find(x => x.id === id); if (r) r.status = status; save(); render();
  } else patch('requests', id, {status});
}
function sendRequest(buyerId) {
  const l = lst(S.current); if (!l || !S.profile || hasReq(l.id, buyerId)) return;
  const r = {listingId:l.id, buyerId, farmerId: l.sample ? 'sample' : me(), farmerName: S.profile.name,
    farmerPhone: S.profile.share ? S.profile.phone : '', status:'pending', createdAt: Date.now()};
  if (l.sample) { r.id = 'sr' + (S.sample.requests.length + 1); r.sample = true; r.farmerName = 'Sample Farmer'; r.farmerPhone = '90000 00000'; S.sample.requests.push(r); save(); render(); }
  else put('requests', newId('r_'), r);
}
function seedSample() {
  if (S.sample !== undefined) return;
  const l = {id:'sample1', farmerId:'sample', farmerName:'Sample Farmer', residue:'rice_straw', qty:1500, cond:'dry',
    district:'Thanjavur', price:2.5, sample:true, createdAt:0};
  const top = match(l).filter(m => !m.b.real).slice(0, 3);
  S.sample = {listing:l, requests: ['accepted', 'pending', 'declined'].map((st, i) => top[i] && ({id:'sr' + (i + 1), sample:true,
    listingId:l.id, buyerId:top[i].b.id, farmerId:'sample', farmerName:'Sample Farmer', farmerPhone:'90000 00000', status:st, createdAt:0})).filter(Boolean)};
  S.current = l.id;
}

/* ---------- render ---------- */
function render() {
  if (S.sample && ownListings().length) { S.sample = null; S.current = null; }
  if (S.role === 'farmer' && S.page.startsWith('b_')) S.page = 'add';
  if (S.role === 'buyer' && !S.page.startsWith('b_')) S.page = 'b_requests';
  document.documentElement.lang = S.lang;
  document.getElementById('title').textContent = '🌾 ' + t('app_title');
  document.getElementById('tagline').textContent = t('tagline');
  document.getElementById('disclaimer').textContent = t('disclaimer');
  document.getElementById('mode').textContent = t(shared ? 'shared_on' : 'shared_off');
  document.getElementById('langs').innerHTML = Object.entries(D.LANGS).map(([k, v]) => `<button data-act="lang" data-id="${k}" aria-pressed="${k === S.lang}">${esc(v)}</button>`).join('');
  document.getElementById('roles').innerHTML = ['farmer', 'buyer'].map(r => `<button data-act="role" data-id="${r}" aria-pressed="${r === S.role}">${esc(t('role_' + r))}</button>`).join('');
  const who = document.getElementById('who'), name = S.role === 'farmer' ? (S.profile && S.profile.name) : (myBuyer() && myBuyer().name);
  who.hidden = !name; if (name) { who.textContent = '👤 ' + name + ' · ' + t('profile'); who.dataset.act = 'nav'; who.dataset.id = S.role === 'farmer' ? 'profile' : 'b_profile'; }
  document.getElementById('tabs').innerHTML = TABS[S.role].map(([p, label, icon]) =>
    `<button data-act="nav" data-id="${p}"${p === S.page ? ' aria-current="page"' : ''}><svg viewBox="0 0 24 24" aria-hidden="true">${icon}</svg><span>${esc(t(label))}</span></button>`).join('');
  const pages = {add:pageAdd, results:pageResults, requests:pageRequests, profile:() => pageFarmerReg(!!S.profile),
    b_requests:pageBRequests, b_listings:pageBListings, b_profile:() => pageBuyerReg(!!myBuyer())};
  document.getElementById('app').innerHTML = pages[S.page]();
  document.getElementById('reset').innerHTML = confirmReset
    ? `<span>Delete saved details and local data on this device? </span><button data-act="reset-yes">Yes, delete</button> · <button data-act="reset-no">Cancel</button>`
    : `<button data-act="reset">Clear saved data on this device</button>`;
  save();
}
function scheduleRender() {
  const a = document.activeElement;
  if (a && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)) pending = true; else render();
}
document.addEventListener('focusout', () => {
  if (!pending) return;
  setTimeout(() => { const a = document.activeElement; if (!(a && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName))) { pending = false; render(); } }, 150);
});
function go(p) {
  S.page = p; shown = 8; errors = []; window.scrollTo(0, 0);
  if (p === 'profile' && S.profile) regDraft = Object.assign({}, S.profile);
  if (p === 'b_profile') { const b = myBuyer(); bDraft = b ? {name:b.name, type:b.type, district:b.district, residues:[...b.residues], conds:[...b.conds],
    min:String(b.minQty), max:String(b.maxQty), price:String(b.maxPrice), phone:b.phone} : bDef(); }
  render();
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  if (act === 'lang') { S.lang = id; render(); }
  else if (act === 'role') { S.role = id; go(id === 'farmer' ? 'add' : 'b_requests'); }
  else if (act === 'nav') go(id);
  else if (act === 'more') { shown += 10; render(); }
  else if (act === 'request') sendRequest(id);
  else if (act === 'accept') setStatus(id, 'accepted');
  else if (act === 'decline') setStatus(id, 'declined');
  else if (act === 'reset') { confirmReset = true; render(); }
  else if (act === 'reset-no') { confirmReset = false; render(); }
  else if (act === 'reset-yes') {
    const keep = S.localId; S = defS(); S.localId = keep; SH = shared ? SH : {buyers:{}, listings:{}, requests:{}};
    seedSample(); regDraft = {name:'', phone:'', district:'', share:false}; bDraft = bDef(); draft.district = ''; confirmReset = false; errors = []; render();
  }
});
document.addEventListener('input', e => {
  const id = e.target.id, m = {residue:'residue', qty:'qty', cond:'cond', district:'district', price:'price'};
  if (m[id]) draft[m[id]] = e.target.value;
  const r = {r_name:'name', r_phone:'phone', r_district:'district'}; if (r[id]) regDraft[r[id]] = e.target.value;
  if (id === 'r_share') regDraft.share = e.target.checked;
  const b = {b_name:'name', b_type:'type', b_phone:'phone', b_district:'district', b_min:'min', b_max:'max', b_price:'price'}; if (b[id]) bDraft[b[id]] = e.target.value;
  if (id.startsWith('br_') || id.startsWith('bc_')) {
    const list = id.startsWith('br_') ? bDraft.residues : bDraft.conds, k = id.slice(3), i = list.indexOf(k);
    if (e.target.checked && i < 0) list.push(k); if (!e.target.checked && i >= 0) list.splice(i, 1);
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'listSel') { S.current = e.target.value; render(); }
  if (e.target.id === 'demoSel') { demoSel = e.target.value; render(); }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const fid = e.target.id;
  if (fid === 'regForm') {
    const phone = normalizePhone(regDraft.phone); errors = [];
    if (!regDraft.name.trim()) errors.push('err_name');
    if (!phone) errors.push('err_phone_req');
    if (!regDraft.district.trim()) errors.push('err_district');
    if (errors.length) { render(); return; }
    const edit = !!S.profile;
    S.profile = {name:regDraft.name.trim(), phone, district:regDraft.district.trim(), share:!!regDraft.share};
    savePrivateProfile(); flash = 'profile_saved'; go(edit ? 'profile' : 'add');
  } else if (fid === 'addForm') {
    const qty = parseFloat(draft.qty), price = parseFloat(draft.price || '0') || 0; errors = [];
    if (!(qty > 0)) errors.push('err_qty');
    if (!draft.district.trim()) errors.push('err_district');
    if (price < 0) errors.push('err_price');
    if (errors.length) { render(); return; }
    const id = newId('l_');
    const doc = {farmerId:me(), farmerName:S.profile.name, residue:draft.residue, qty, cond:draft.cond,
      district:draft.district.trim(), price: price > 0 ? price : null, createdAt:Date.now()};
    draft.qty = '100'; draft.district = ''; draft.price = '0';
    put('listings', id, doc); S.sample = null; S.current = id; flash = 'saved_ok'; go('results');
  } else if (fid === 'bForm') {
    const d = bDraft, phone = normalizePhone(d.phone), min = parseFloat(d.min) || 0, max = parseFloat(d.max) || 0, price = parseFloat(d.price) || 0; errors = [];
    if (!d.name.trim()) errors.push('err_b_name');
    if (!phone) errors.push('err_phone_req');
    if (!d.district.trim()) errors.push('err_district');
    if (!d.residues.length) errors.push('err_b_residue');
    if (!d.conds.length) errors.push('err_b_cond');
    if (max < min || max <= 0) errors.push('err_b_qty');
    if (errors.length) { render(); return; }
    const edit = !!myBuyer();
    put('buyers', me(), {name:d.name.trim(), type:d.type, district:d.district.trim(), residues:[...d.residues], conds:[...d.conds],
      minQty:min, maxQty:max, maxPrice:price, phone, createdAt:Date.now()});
    flash = 'b_saved'; go(edit ? 'b_profile' : 'b_requests');
  }
});

/* ---------- start ---------- */
seedSample();
render();
(async () => {
  try {
    const cl = window.claude;
    if (cl && cl.use) {
      const user = await cl.use('user'); const id = user ? await user.id() : null; if (id) uid = id;
      const db = await cl.use('db');
      if (db) {
        dbh = db; shared = true; SH = {buyers:{}, listings:{}, requests:{}};
        ['buyers', 'listings', 'requests'].forEach(c => db.collection(c).onSnapshot(snap => {
          const m = {}; snap.docs.forEach(d => { m[d.id] = d.data(); }); SH[c] = m; scheduleRender();
        }, () => { shared = false; scheduleRender(); }));
        loadPrivateProfile();
      }
    }
  } catch (e) {}
  render();
})();
</script>
